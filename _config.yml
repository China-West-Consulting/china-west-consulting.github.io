# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

markdown: kramdown
title: China West Consulting
email: hello@chinawest.consulting
description: >- # this means to ignore newlines until "baseurl:"
  China West Consulting
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  China-West-Consulting

# Build settings
#theme: minima
remote_theme: "mmistakes/so-simple-theme@3.2.0"
plugins:
  - jekyll-feed	

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
#

search_full_content: true
category_archive_path: "/"
tag_archive_path: "/tags/#"

collections:
  posts:
    output: true
    permalink: /:categories/:title/
  insights:
    output: true
    permalink: /news/:year/:month/:day/:title/
  successes:
    output: true
    permalink: /successes/:year/:month/:day/:title/
  culture:
    output: true
    permalink: /culture/:year/:month/:day/:title/
  resources:
    output: true
    permalink: /resources/:year/:month/:day/:title/
  landing:
    output: true          # generate standalone pages
    permalink: /landing/:year/:month/:day/:name/  # URL for each item



# Front Matter Defaults
defaults:
  # Post defaults
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      comments: true
      share: true
  # Success stories
  - scope:
      path: "successes/_posts"
      type: posts
    values:
      permalink: successes/:year/:month/:day/:title
      category: successes
  # Insights
  - scope:
      path: "insights/_posts"
      type: posts
    values:
      permalink: insights/:year/:month/:day/:title
      category: insights
  # culture
  - scope:
      path: "culture/_posts"
      type: posts
    values:
      permalink: culture/:year/:month/:day/:title
      category: culture
  # resources
  - scope:
      path: "resources/_posts"
      type: posts
    values:
      permalink: resources/:year/:month/:day/:title
      category: resources

logo: /assets/logo.png

read_time: true

# Site Author
author:
  email: hi@chinawest.consulting
  links: false

# Footer Links
footer_links:
  - title: X
    url: https://x.com/ChinaWestConsul
    icon: fab fa-x-twitter
  - title: GitHub
    url: https://github.com/China-West-Consulting
    icon: fab fa-github-square
  - title: Youtube
    url: https://www.youtube.com/@ChinaWestConsulting
    icon: fab fa-youtube-square
  - title: Feed
    url: feed.xml
    icon: fas fa-rss-square
